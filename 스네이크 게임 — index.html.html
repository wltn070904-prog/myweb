<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101712">
  <title>스네이크 아케이드</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101712;
      --panel: #18231c;
      --line: #2a3a2e;
      --green: #62e879;
      --green-dark: #2fac4c;
      --text: #ecf5ed;
      --muted: #9aab9e;
      --food: #ff6b5f;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 24px 16px;
      display: grid;
      place-items: center;
      background:
        radial-gradient(ellipse at top, #1b2b20 0%, var(--bg) 58%);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    .app {
      width: min(100%, 520px);
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.35rem, 5vw, 1.8rem);
      letter-spacing: .02em;
    }

    .score-box {
      min-width: 90px;
      padding: 8px 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--panel);
      text-align: center;
    }

    .score-label {
      display: block;
      color: var(--muted);
      font-size: .68rem;
      font-weight: 700;
      letter-spacing: .12em;
    }

    #score {
      color: var(--green);
      font-size: 1.35rem;
      font-weight: 800;
      line-height: 1.2;
    }

    .game-card {
      overflow: hidden;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(24, 35, 28, .92);
      box-shadow: 0 18px 50px #0005;
    }

    .board-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 1;
      overflow: hidden;
      border-radius: 10px;
      background: #0b120e;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 20px;
      background: #07100bd9;
      text-align: center;
    }

    .overlay[hidden] { display: none; }

    .overlay-content {
      max-width: 290px;
    }

    .overlay h2 {
      margin: 0 0 7px;
      color: var(--green);
      font-size: clamp(1.3rem, 6vw, 1.8rem);
    }

    .overlay p {
      margin: 0;
      color: #cad6cc;
      line-height: 1.5;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 14px;
    }

    button {
      min-height: 44px;
      padding: 10px 16px;
      border: 1px solid #3a4c3e;
      border-radius: 11px;
      background: #223128;
      color: var(--text);
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: background .15s, transform .1s, border-color .15s;
      -webkit-tap-highlight-color: transparent;
    }

    button:hover { background: #2b3e31; border-color: #59715e; }
    button:active { transform: scale(.96); }
    button:focus-visible { outline: 3px solid #88f59a; outline-offset: 2px; }

    #startBtn {
      border-color: var(--green-dark);
      background: #1d6930;
    }

    #startBtn:hover { background: #25803b; }

    .hint {
      margin: 12px 4px 0;
      color: var(--muted);
      font-size: .83rem;
      text-align: center;
    }

    .dpad {
      display: none;
      width: min(100%, 220px);
      margin: 16px auto 0;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(2, 58px);
      gap: 8px;
      user-select: none;
      -webkit-user-select: none;
    }

    .dpad button {
      min-height: 58px;
      padding: 0;
      border-radius: 14px;
      background: #223128;
      font-size: 1.5rem;
      touch-action: manipulation;
    }

    .dpad .up { grid-column: 2; grid-row: 1; }
    .dpad .left { grid-column: 1; grid-row: 2; }
    .dpad .down { grid-column: 2; grid-row: 2; }
    .dpad .right { grid-column: 3; grid-row: 2; }

    @media (pointer: coarse), (max-width: 700px) {
      body { padding: 16px 12px 22px; }
      .dpad { display: grid; }
      .game-card { padding: 9px; }
      .hint { margin-top: 10px; }
    }

    @media (max-width: 360px) {
      .controls { gap: 7px; }
      .controls button { padding-inline: 12px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <h1>🐍 스네이크</h1>
      <div class="score-box" aria-label="현재 점수">
        <span class="score-label">SCORE</span>
        <span id="score">0</span>
      </div>
    </header>

    <section class="game-card" aria-label="스네이크 게임">
      <div class="board-wrap">
        <canvas id="game" width="600" height="600"
                role="img" aria-label="20 곱하기 20 스네이크 게임판"></canvas>
        <div class="overlay" id="overlay">
          <div class="overlay-content">
            <h2 id="overlayTitle">준비됐나요?</h2>
            <p id="overlayMessage">시작 버튼을 누르거나 방향키를 눌러 시작하세요.</p>
          </div>
        </div>
      </div>

      <div class="controls">
        <button id="startBtn" type="button">시작</button>
        <button id="pauseBtn" type="button">일시정지</button>
        <button id="restartBtn" type="button">다시 시작</button>
      </div>

      <div class="dpad" aria-label="터치 방향 버튼">
        <button class="up" type="button" data-dir="up" aria-label="위로">▲</button>
        <button class="left" type="button" data-dir="left" aria-label="왼쪽">◀</button>
        <button class="down" type="button" data-dir="down" aria-label="아래로">▼</button>
        <button class="right" type="button" data-dir="right" aria-label="오른쪽">▶</button>
      </div>
    </section>

    <p class="hint">PC: 방향키로 이동 · 스마트폰/태블릿: 화면 버튼으로 이동</p>
  </main>

  <script>
    (() => {
      "use strict";

      const SIZE = 20;
      const CELL = 30;
      const STEP_MS = 125;

      const canvas = document.getElementById("game");
      const ctx = canvas.getContext("2d");
      const scoreEl = document.getElementById("score");
      const overlay = document.getElementById("overlay");
      const overlayTitle = document.getElementById("overlayTitle");
      const overlayMessage = document.getElementById("overlayMessage");
      const startBtn = document.getElementById("startBtn");
      const pauseBtn = document.getElementById("pauseBtn");
      const restartBtn = document.getElementById("restartBtn");

      const vectors = {
        up:    { x: 0, y: -1 },
        down:  { x: 0, y: 1 },
        left:  { x: -1, y: 0 },
        right: { x: 1, y: 0 }
      };

      let snake;
      let food;
      let direction;
      let turnQueue;
      let score;
      let state;
      let timer = null;

      function resetGame(autostart = false) {
        snake = [
          { x: 10, y: 10 },
          { x: 9, y: 10 },
          { x: 8, y: 10 }
        ];
        direction = "right";
        turnQueue = [];
        score = 0;
        food = randomFood();
        state = autostart ? "running" : "ready";
        scoreEl.textContent = score;
        updateOverlay();
        draw();
        syncTimer();
      }

      function randomFood() {
        const free = [];
        for (let y = 0; y < SIZE; y++) {
          for (let x = 0; x < SIZE; x++) {
            if (!snake?.some(part => part.x === x && part.y === y)) {
              free.push({ x, y });
            }
          }
        }
        return free.length ? free[Math.floor(Math.random() * free.length)] : null;
      }

      function setState(next) {
        state = next;
        updateOverlay();
        syncTimer();
        draw();
      }

      function updateOverlay() {
        const show = state !== "running";
        overlay.hidden = !show;

        if (state === "ready") {
          overlayTitle.textContent = "준비됐나요?";
          overlayMessage.textContent = "시작 버튼을 누르거나 방향키를 눌러 시작하세요.";
          startBtn.textContent = "시작";
        } else if (state === "paused") {
          overlayTitle.textContent = "일시정지";
          overlayMessage.textContent = "시작 버튼을 누르면 게임을 이어갑니다.";
          startBtn.textContent = "계속하기";
        } else if (state === "over") {
          overlayTitle.textContent = "게임 종료";
          overlayMessage.textContent = `최종 점수: ${score}점 · 다시 시작 버튼을 눌러 도전하세요.`;
          startBtn.textContent = "시작";
        } else if (state === "won") {
          overlayTitle.textContent = "승리!";
          overlayMessage.textContent = `모든 칸을 채웠습니다. 최종 점수: ${score}점`;
          startBtn.textContent = "시작";
        }
      }

      function syncTimer() {
        if (timer !== null) {
          clearInterval(timer);
          timer = null;
        }
        if (state === "running") timer = setInterval(tick, STEP_MS);
      }

      function startOrResume() {
        if (state === "ready" || state === "paused") {
          setState("running");
        } else if (state === "over" || state === "won") {
          resetGame(true);
        }
      }

      function togglePause() {
        if (state === "running") setState("paused");
        else if (state === "paused") setState("running");
      }

      function requestDirection(next) {
        if (!vectors[next] || state === "over" || state === "won") return;

        // 대기 중인 방향을 기준으로 반대 방향을 막아 빠른 입력에도 역주행하지 않습니다.
        const previous = turnQueue.length
          ? turnQueue[turnQueue.length - 1]
          : direction;
        const a = vectors[previous];
        const b = vectors[next];

        if (a.x + b.x === 0 && a.y + b.y === 0) return;
        if (next === previous) return;

        // 한 번에 너무 많은 회전이 쌓이지 않도록 제한합니다.
        if (turnQueue.length < 2) turnQueue.push(next);

        if (state === "ready") setState("running");
      }

      function tick() {
        if (state !== "running") return;

        if (turnQueue.length) direction = turnQueue.shift();
        const move = vectors[direction];
        const head = {
          x: snake[0].x + move.x,
          y: snake[0].y + move.y
        };

        const eating = food && head.x === food.x && head.y === food.y;
        const bodyToCheck = eating ? snake : snake.slice(0, -1);

        if (
          head.x < 0 || head.x >= SIZE ||
          head.y < 0 || head.y >= SIZE ||
          bodyToCheck.some(part => part.x === head.x && part.y === head.y)
        ) {
          setState("over");
          return;
        }

        snake.unshift(head);
        if (eating) {
          score += 10;
          scoreEl.textContent = score;
          food = randomFood();
          if (!food) {
            setState("won");
            return;
          }
        } else {
          snake.pop();
        }

        draw();
      }

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 바둑판형 어두운 배경과 얇은 격자선
        ctx.fillStyle = "#0b120e";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = "#17241b";
        ctx.lineWidth = 1;

        for (let i = 0; i <= SIZE; i++) {
          const pos = i * CELL + 0.5;
          ctx.beginPath();
          ctx.moveTo(pos, 0);
          ctx.lineTo(pos, canvas.height);
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(0, pos);
          ctx.lineTo(canvas.width, pos);
          ctx.stroke();
        }

        if (food) {
          const cx = food.x * CELL + CELL / 2;
          const cy = food.y * CELL + CELL / 2;
          ctx.fillStyle = "#ff6b5f";
          ctx.beginPath();
          ctx.arc(cx, cy, CELL * .34, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = "#ffd3a5";
          ctx.beginPath();
          ctx.arc(cx - 3, cy - 4, 2.5, 0, Math.PI * 2);
          ctx.fill();
        }

        snake.forEach((part, index) => {
          const inset = 2;
          ctx.fillStyle = index === 0 ? "#83f594" : "#42c960";
          roundedRect(
            part.x * CELL + inset,
            part.y * CELL + inset,
            CELL - inset * 2,
            CELL - inset * 2,
            index === 0 ? 8 : 6
          );
          ctx.fill();
        });

        // 뱀 머리의 눈
        if (snake.length) {
          const head = snake[0];
          const eyePositions = {
            right: [[.68, .34], [.68, .66]],
            left:  [[.32, .34], [.32, .66]],
            up:    [[.34, .32], [.66, .32]],
            down:  [[.34, .68], [.66, .68]]
          };
          ctx.fillStyle = "#102017";
          eyePositions[direction].forEach(([x, y]) => {
            ctx.beginPath();
            ctx.arc(
              head.x * CELL + CELL * x,
              head.y * CELL + CELL * y,
              2.2,
              0,
              Math.PI * 2
            );
            ctx.fill();
          });
        }
      }

      function roundedRect(x, y, width, height, radius) {
        ctx.beginPath();
        ctx.roundRect(x, y, width, height, radius);
      }

      const keyToDirection = {
        ArrowUp: "up",
        ArrowDown: "down",
        ArrowLeft: "left",
        ArrowRight: "right"
      };

      document.addEventListener("keydown", event => {
        if (keyToDirection[event.key]) {
          event.preventDefault();
          requestDirection(keyToDirection[event.key]);
        } else if (event.code === "Space") {
          event.preventDefault();
          if (state === "ready") startOrResume();
          else togglePause();
        }
      });

      document.querySelectorAll(".dpad button").forEach(button => {
        const press = event => {
          event.preventDefault();
          requestDirection(button.dataset.dir);
        };
        button.addEventListener("pointerdown", press);
        button.addEventListener("click", event => {
          // 포인터 이벤트를 지원하지 않는 환경의 대체 입력
          if (!window.PointerEvent) press(event);
        });
      });

      startBtn.addEventListener("click", startOrResume);
      pauseBtn.addEventListener("click", togglePause);
      restartBtn.addEventListener("click", () => resetGame(true));

      resetGame(false);
    })();
  </script>
</body>
</html>
